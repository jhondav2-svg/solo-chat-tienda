
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chat Online - Tienda Pepe</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        .contenedor {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            margin: auto;
            display: flex;
            flex-direction: column;
            background: white;
            box-shadow: 0 0 20px #00000015;
        }

        .cabecera {
            background: #0e0f11;
            color: white;
            padding: 18px;
        }

        .titulo {
            font-size: 20px;
            font-weight: bold;
        }

        .estado {
            font-size: 12px;
            margin-top: 8px;
            color: #ffb0b0;
        }

        .estado.conectado {
            color: #46c76b;
        }

        .configuracion {
            padding: 12px;
            background: #fff;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 8px;
        }

        select, input {
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        select {
            width: 125px;
        }

        .configuracion input {
            flex: 1;
        }

        .mensajes {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f1f3f6;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mensaje {
            max-width: 82%;
            padding: 12px;
            border-radius: 14px;
            overflow-wrap: anywhere;
            box-shadow: 0 2px 5px #00000008;
        }

        .propio {
            align-self: flex-end;
            background: #e31b23;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .otro {
            align-self: flex-start;
            background: white;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        .autor {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .texto {
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .barra {
            padding: 12px;
            display: flex;
            gap: 10px;
            background: white;
            border-top: 1px solid #eee;
        }

        .barra input {
            flex: 1;
        }

        button {
            background: #e31b23;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (min-width: 600px) {
            body {
                padding: 20px;
            }

            .contenedor {
                height: calc(100dvh - 40px);
                border-radius: 14px;
                overflow: hidden;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="cabecera">
        <div class="titulo">TIENDA PEPE</div>
        <div id="estado" class="estado">
            Conectando...
        </div>
    </div>

    <div class="configuracion">
        <select id="tipoUsuario">
            <option value="Cliente">Cliente</option>
            <option value="Tienda">Tienda</option>
        </select>

        <input
            id="nombre"
            type="text"
            placeholder="Tu nombre"
            maxlength="30"
        >
    </div>

    <div id="mensajes" class="mensajes">
    </div>

    <form id="formulario" class="barra">

        <input
            id="mensaje"
            type="text"
            placeholder="Escribe tu mensaje..."
            maxlength="2000"
            autocomplete="off"
            required
        >

        <button id="enviar" type="submit">
            Enviar
        </button>

    </form>

</div>

<script>
    const socket = io();

    const mensajes = document.getElementById("mensajes");
    const formulario = document.getElementById("formulario");
    const campo = document.getElementById("mensaje");
    const estado = document.getElementById("estado");
    const boton = document.getElementById("enviar");
    const nombre = document.getElementById("nombre");
    const tipoUsuario = document.getElementById("tipoUsuario");

    const identificador = Math.random()
        .toString(36)
        .slice(2);

    let pendientes = [];

    socket.on("connect", function () {
        estado.textContent = "● Conectado";
        estado.classList.add("conectado");
        boton.disabled = false;
    });

    socket.on("disconnect", function () {
        estado.textContent = "● Desconectado";
        estado.classList.remove("conectado");
        boton.disabled = true;
    });

    function mostrarMensaje(datos, esPropio) {
        const burbuja = document.createElement("div");

        burbuja.className = esPropio
            ? "mensaje propio"
            : "mensaje otro";

        const autor = document.createElement("div");
        autor.className = "autor";
        autor.textContent = datos.usuario;

        const texto = document.createElement("div");
        texto.className = "texto";
        texto.textContent = datos.texto;

        burbuja.appendChild(autor);
        burbuja.appendChild(texto);

        mensajes.appendChild(burbuja);

        mensajes.scrollTop = mensajes.scrollHeight;
    }

    formulario.addEventListener("submit", function (evento) {
        evento.preventDefault();

        if (!socket.connected) {
            alert("No hay conexión con el servidor");
            return;
        }

        const texto = campo.value.trim();

        if (!texto) return;

        const rol = tipoUsuario.value;

        const usuario = rol === "Tienda"
            ? "TIENDA PEPE"
            : (nombre.value.trim() || "Cliente");

        pendientes.push({
            usuario: usuario,
            texto: texto
        });

        socket.emit("mensaje", {
            usuario: usuario,
            texto: texto
        });

        campo.value = "";
        campo.focus();
    });

    socket.on("mensaje", function (datos) {
        let esPropio = false;

        const indice = pendientes.findIndex(function (item) {
            return item.usuario === datos.usuario &&
                   item.texto === datos.texto;
        });

        if (indice !== -1) {
            esPropio = true;
            pendientes.splice(indice, 1);
        }

        mostrarMensaje(datos, esPropio);
    });
</script>

</body>
</html>
